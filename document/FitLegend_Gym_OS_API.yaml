  /users/google/:
    post:
      operationId: users_google_create
      description: |-
        POST /users/google/ — body: {"id_token": "<credential from Google Identity Services>"}

        Google's current Identity Services SDK (google.accounts.id — the
        only non-deprecated one) hands the frontend a JWT it calls
        "credential", which is an ID token, not an OAuth access token.
        dj-rest-auth's SocialLoginSerializer only enters its token-exchange
        path when access_token (or code) is present, so an id_token-only
        request was being rejected outright with "access_token or code is
        required" before Google was ever contacted. We mirror id_token into
        access_token below so the serializer proceeds — dj-rest-auth then
        special-cases provider_id == "google" to verify the id_token locally
        against Google's public keys rather than calling Google's userinfo
        endpoint with it as a bearer token, which is what a legacy
        access_token-only request still falls back to.

        Also wraps validation in try/except: any failure on Google's side
        (expired/tampered token, wrong audience, userinfo fetch failing)
        raises allauth's OAuth2Error, which dj-rest-auth does not catch —
        that was surfacing as a raw unhandled 500 instead of a normal 400.

        Still accepts the legacy {"access_token": "..."} shape too.
      summary: Login/register with Google
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
          description: Login successful — user details returned, JWT set via httpOnly
            cookies.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
