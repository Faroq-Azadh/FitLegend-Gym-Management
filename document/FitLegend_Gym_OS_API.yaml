openapi: 3.0.3
info:
  title: FitLegend Gym OS API
  version: 1.0.0
  description: API documentation for FitLegend Gym OS
paths:
  /attendance/check-in/:
    post:
      operationId: attendance_check_in_create
      description: POST /attendance/check-in/ — once per Tehran calendar day.
      summary: Self check-in for today
      tags:
      - attendance
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceLog'
          description: ''
  /attendance/my-checkins/:
    get:
      operationId: attendance_my_checkins_list
      description: GET /attendance/my-checkins/ — own check-in history, newest first.
      tags:
      - attendance
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceLog'
          description: ''
  /attendance/staff-check-in/:
    post:
      operationId: attendance_staff_check_in_create
      description: |-
        POST /attendance/staff-check-in/ — front desk (owner or coach) logs a
        member in: {member_id}. Same once-per-day rule as self check-in, so
        the two paths can't double-book the same visit.
      summary: Front-desk check-in of a member
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCheckIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffCheckIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffCheckIn'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAttendanceLog'
          description: ''
  /billing/my-payments/:
    get:
      operationId: billing_my_payments_list
      description: GET /billing/my-payments/ — own payment history, newest first.
      tags:
      - billing
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
          description: ''
  /billing/payments/:
    get:
      operationId: billing_payments_list
      description: |-
        GET  /billing/payments/  — owner: all gym payments (payments.html)
        POST /billing/payments/  — owner: record a manual payment
        ?member=<uuid> filters to one member's history.
      summary: List all gym payments
      parameters:
      - in: query
        name: member
        schema:
          type: string
        description: Filter to one member's payment history (UUID).
      tags:
      - billing
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentAdmin'
          description: ''
    post:
      operationId: billing_payments_create
      description: |-
        GET  /billing/payments/  — owner: all gym payments (payments.html)
        POST /billing/payments/  — owner: record a manual payment
        ?member=<uuid> filters to one member's history.
      summary: Record a manual payment
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreateResponse'
          description: ''
  /billing/payments/{id}/refund/:
    post:
      operationId: billing_payments_refund_create
      description: |-
        POST /billing/payments/{id}/refund/ — owner marks a payment refunded.
        No row deletion — a refund is a status change, so the record stays
        auditable.
      summary: Mark a payment refunded
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - billing
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAdmin'
          description: ''
  /classes/:
    get:
      operationId: classes_list
      description: 'GET/POST /classes/ — owner: weekly class templates.'
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GymClass'
          description: ''
    post:
      operationId: classes_create
      description: 'GET/POST /classes/ — owner: weekly class templates.'
      summary: Create a class
      tags:
      - classes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClassWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassWrite'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymClass'
          description: 'Class created — {detail: str, class: GymClassSerializer}'
  /classes/{id}/:
    get:
      operationId: classes_retrieve
      description: |-
        GET/PATCH /classes/{id}/ — owner: edit template. No DELETE — bookings
        reference it; set is_active=False to retire a slot.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymClass'
          description: ''
    put:
      operationId: classes_update
      description: |-
        GET/PATCH /classes/{id}/ — owner: edit template. No DELETE — bookings
        reference it; set is_active=False to retire a slot.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: classes_partial_update
      description: |-
        GET/PATCH /classes/{id}/ — owner: edit template. No DELETE — bookings
        reference it; set is_active=False to retire a slot.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          description: No response body
  /classes/available/:
    get:
      operationId: classes_available_retrieve
      description: |-
        GET /classes/available/ — member (classes-booking.html): the next 7 days'
        occurrences with per-date fill and whether the member already booked, plus
        KPIs (open-to-book count, classes attended this month).
      summary: Next 7 days' bookable occurrences + KPIs
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableClasses'
          description: ''
  /classes/bookings/:
    get:
      operationId: classes_bookings_retrieve
      description: |-
        GET /classes/bookings/ — owner roster (admin-bookings.html).
        ?status=PENDING|CONFIRMED|WAITLISTED|CANCELED|REJECTED  ?date=YYYY-MM-DD
      summary: Owner bookings roster + summary
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Filter to one date, YYYY-MM-DD.
      - in: query
        name: q
        schema:
          type: string
        description: Search member first/last name.
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated statuses, e.g. PENDING or CANCELED,REJECTED.
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRoster'
          description: ''
  /classes/bookings/{id}/approve/:
    post:
      operationId: classes_bookings_approve_create
      description: 'POST /classes/bookings/{id}/approve/ — owner: PENDING → CONFIRMED.'
      summary: Approve a pending booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingApproveResponse'
          description: ''
  /classes/bookings/{id}/cancel/:
    post:
      operationId: classes_bookings_cancel_create
      description: |-
        POST /classes/bookings/{id}/cancel/ — member cancels own booking.
        Frees a seat if it was holding one, so the waitlist is promoted.
      summary: Cancel own booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCancelResponse'
          description: ''
  /classes/bookings/{id}/reject/:
    post:
      operationId: classes_bookings_reject_create
      description: |-
        POST /classes/bookings/{id}/reject/ — owner rejects a PENDING/CONFIRMED
        booking. Frees a seat, so the earliest waitlisted member is promoted.
      summary: Reject a pending/confirmed booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRejectResponse'
          description: ''
  /classes/bookings/create/:
    post:
      operationId: classes_bookings_create_create
      description: POST /classes/bookings/ — member books {class_id, date}.
      summary: Book a class occurrence
      tags:
      - classes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreateResponse'
          description: ''
  /classes/calendar/:
    get:
      operationId: classes_calendar_retrieve
      description: |-
        GET /classes/calendar/ — owner weekly grid + KPIs (admin-classes.html):
        active classes this week, full classes, avg capacity fill %, coaches involved.
      summary: Owner weekly calendar grid + KPIs
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassCalendar'
          description: ''
  /classes/my-bookings/:
    get:
      operationId: classes_my_bookings_list
      description: 'GET /classes/my-bookings/ — member: own active bookings, soonest
        first.'
      summary: Member's own active bookings
      tags:
      - classes
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyBookingRow'
          description: ''
  /coaches/:
    get:
      operationId: coaches_team_list
      description: |-
        GET /coaches/ — owner: the team table + KPIs (admin-coaches.html).
        ?type=coach|staff  ?search=<name>

        Note: was previously a plain ListAPIView returning a bare array — now
        returns {"summary": {...}, "coaches": [...]}. If anything already
        calls this expecting a bare list, that call site needs updating too.

        No "امتیاز" (rating): there's no review/rating model in the schema
        yet, so that mockup column has nothing real to bind to. Left out
        rather than invented — say the word if you want that built.
      summary: 'Owner: coach/staff team list with KPIs'
      tags:
      - coaches
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachTeamList'
          description: ''
  /coaches/{id}/:
    get:
      operationId: coaches_retrieve
      description: |-
        GET   /coaches/{id}/ — owner: coach detail
        PATCH /coaches/{id}/ — owner: edit profile fields / is_active.
        No DELETE — attendance history, plans and members reference the
        coach; deactivate instead.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - coaches
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachDetail'
          description: ''
    put:
      operationId: coaches_update
      description: |-
        GET   /coaches/{id}/ — owner: coach detail
        PATCH /coaches/{id}/ — owner: edit profile fields / is_active.
        No DELETE — attendance history, plans and members reference the
        coach; deactivate instead.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - coaches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachDetailUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoachDetailUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CoachDetailUpdate'
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachDetailUpdate'
          description: ''
    patch:
      operationId: coaches_partial_update
      description: |-
        GET   /coaches/{id}/ — owner: coach detail
        PATCH /coaches/{id}/ — owner: edit profile fields / is_active.
        No DELETE — attendance history, plans and members reference the
        coach; deactivate instead.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - coaches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCoachDetailUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCoachDetailUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCoachDetailUpdate'
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachDetailUpdate'
          description: ''
  /coaches/add_coach/:
    post:
      operationId: coaches_add_coach_create
      description: POST /coaches/add_coach/ — OWNER creates a COACH user + CoachProfile
        together.
      tags:
      - coaches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoachCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CoachCreate'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachCreate'
          description: ''
  /coaches/dashboard/:
    get:
      operationId: coaches_dashboard_retrieve
      description: GET /coaches/dashboard/ — the coach home screen aggregate.
      summary: Coach home screen aggregate
      tags:
      - coaches
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachDashboard'
          description: ''
  /coaches/me/:
    get:
      operationId: coaches_me_retrieve
      description: |-
        GET   /coaches/me/  — coach: own profile (coach-profile.html)
        PATCH /coaches/me/  — coach: self-edit, limited fields; email syncs
        to the login account, position/is_active stay owner-only
      tags:
      - coaches
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachDetail'
          description: ''
    put:
      operationId: coaches_me_update
      description: |-
        GET   /coaches/me/  — coach: own profile (coach-profile.html)
        PATCH /coaches/me/  — coach: self-edit, limited fields; email syncs
        to the login account, position/is_active stay owner-only
      tags:
      - coaches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachSelfUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoachSelfUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CoachSelfUpdate'
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachSelfUpdate'
          description: ''
    patch:
      operationId: coaches_me_partial_update
      description: |-
        GET   /coaches/me/  — coach: own profile (coach-profile.html)
        PATCH /coaches/me/  — coach: self-edit, limited fields; email syncs
        to the login account, position/is_active stay owner-only
      tags:
      - coaches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCoachSelfUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCoachSelfUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCoachSelfUpdate'
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachSelfUpdate'
          description: ''
  /coaches/my-students/:
    get:
      operationId: coaches_my_students_list
      description: |-
        GET /coaches/my-students/ — coach-students.html table.
        ?status=all|active|expiring|expired  ?search=<name>
      summary: Coach's students table
      tags:
      - coaches
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoachStudentRow'
          description: ''
  /coaches/performance/:
    get:
      operationId: coaches_performance_retrieve
      description: |-
        GET /coaches/performance/ — performance.html aggregate.
        ?days=30|90|365 (default 30). Null-safe when the coach has no data yet.
      summary: Coach performance report
      tags:
      - coaches
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachPerformance'
          description: ''
  /exercises/:
    get:
      operationId: exercises_list
      description: |-
        GET /exercises/ — active exercises of the caller's own gym.
        Used by both the member app's exercise picker and the coach's
        program-builder exercise picker — was member-only before, which
        meant a coach couldn't browse the library to build a plan at all.
      tags:
      - exercises
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExercisePicker'
          description: ''
  /gyms/dashboard/:
    get:
      operationId: gyms_dashboard_retrieve
      description: GET /gyms/dashboard/ — owner home screen (admin.html).
      summary: Owner home screen aggregate
      tags:
      - gyms
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDashboard'
          description: ''
  /gyms/me/:
    get:
      operationId: gyms_me_retrieve
      description: |-
        GET  /api/v1/gyms/me/  -> the logged-in owner's gym, nested with
                                  settings + subscription (read-only)
        PATCH /api/v1/gyms/me/ -> update identity fields only (see
                                  GymDetailSerializer.read_only_fields)
      tags:
      - gyms
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymDetail'
          description: ''
    put:
      operationId: gyms_me_update
      description: |-
        GET  /api/v1/gyms/me/  -> the logged-in owner's gym, nested with
                                  settings + subscription (read-only)
        PATCH /api/v1/gyms/me/ -> update identity fields only (see
                                  GymDetailSerializer.read_only_fields)
      tags:
      - gyms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GymDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GymDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GymDetail'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymDetail'
          description: ''
    patch:
      operationId: gyms_me_partial_update
      description: |-
        GET  /api/v1/gyms/me/  -> the logged-in owner's gym, nested with
                                  settings + subscription (read-only)
        PATCH /api/v1/gyms/me/ -> update identity fields only (see
                                  GymDetailSerializer.read_only_fields)
      tags:
      - gyms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGymDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGymDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGymDetail'
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymDetail'
          description: ''
  /gyms/me/settings/:
    get:
      operationId: gyms_me_settings_retrieve
      description: GET/PATCH /api/v1/gyms/me/settings/ — timezone, currency, working
        hours.
      tags:
